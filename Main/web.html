<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Course | Short Study</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="web.css">
    <link rel="icon" type="image/png" href="h.png">
    <script>
        // Night mode - Load immediately before page renders to prevent flash
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><span class="logo-icon">&lt;/&gt;</span> Short<span>Study</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li class="dropdown">
                    <a href="web.html" class="dropbtn">Courses &#9662;</a>
                    <ul class="dropdown-content">
                        <li><a href="web.html">Web Development</a></li>
                        <li><a href="web.html">Python (Machine Learning)</a></li>
                        <li><a href="web.html">Data Science</a></li>
                    </ul>
                </li>
                <li><a href="#">Affiliate Marketing</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="other.html">Others</a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </div>
    </nav>

    <button class="theme-toggle floating" id="themeToggle" title="Toggle Night Mode">
        <span class="theme-icon">🌙</span>
    </button>

    <section class="courses-page">
        <div class="courses-header">
            <h1>Web Development Courses</h1>
            <p>Master modern web development with our comprehensive, project-based courses</p>
        </div>

        <div class="courses-container" id="coursesContainer">
            <!-- Courses loaded dynamically from admin panel -->
        </div>
    </section>

    <script src="script.js"></script>
    <script src="web.js"></script>
    <script>
        // Night mode functionality
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        
        // Get current theme (already set in head)
        const currentTheme = localStorage.getItem('theme') || 'light';
        updateThemeButton(currentTheme);
        
        themeToggle.addEventListener('click', () => {
            const theme = htmlElement.getAttribute('data-theme');
            const newTheme = theme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton(newTheme);
        });
        
        function updateThemeButton(theme) {
            const icon = themeToggle.querySelector('.theme-icon');
            icon.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
    </script>
</body>
</html>
